<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>행성 합치기</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060f; }
    #unity-canvas { display: block; width: 100vw; height: 100vh; background: #05060f; touch-action: none; }
  </style>
  <!--
    원스토어 Web 상품용 페이지 (games/_template/onestore/index.html → scripts/build-onestore-web.mjs 가 치환).
    원스토어 앱은 이 페이지를 iframe 으로 띄우고 H5 Game SDK 의 startGameAsync() 가 성공해야 네이티브 로딩 화면을 걷는다.
    SDK 는 게임 코드보다 먼저, 문서 최상위에서 로드해야 한다(원스토어 가이드 01·02).
    일반 브라우저에서는 initializeAsync() 가 {err: "Platform Not Supported"} 를 돌려준다 — 그때는 SDK 없이 게임만 띄운다.
  -->
  <script type="module">
    import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";
    const sdk = createSDK();
    let hosted = false;

    // pause/resume 은 받지 않는다: 광고·결제를 붙이지 않았고, 백그라운드 전환은 웹뷰가 rAF 를 멈춘다.
    // 광고를 붙이는 회차에 Unity 쪽 일시정지 수신부와 함께 배선할 것.

    const ready = sdk.initializeAsync()
      .then((info) => { hosted = !info.err; return hosted; })
      .catch((e) => { console.error("[onestore] initializeAsync 실패", e.reason, e.message); return false; });

    window.__onestore = {
      progress(p) { if (hosted) sdk.setLoadingProgress(Math.round(p * 100)); },
      started() {
        return ready.then((ok) => ok && sdk.startGameAsync()
          .catch((e) => console.error("[onestore] startGameAsync 실패", e.reason, e.message)));
      },
    };
    window.dispatchEvent(new Event("onestore-ready"));
  </script>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    (function () {
      var config = {
        dataUrl: "Build/4ddd8ac171d2cdda505679c14e67c5e3.data",
        frameworkUrl: "Build/d03048e64e449c89c5ceed9d75eb1aa0.framework.js",
        codeUrl: "Build/fa674efa1f75267d247373bfe00d4364.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "JSH",
        productName: "행성 합치기",
        productVersion: "2026-09-25",
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      function boot() {
        var os = window.__onestore;
        var script = document.createElement("script");
        script.src = "Build/ee04772050d7150f93015855f2d15d9b.loader.js";
        script.onload = function () {
          createUnityInstance(document.querySelector("#unity-canvas"), config, function (p) {
            if (os) os.progress(p);
          }).then(function (instance) {
            window.unityInstance = instance;
            if (os) os.started();
          }).catch(function (e) {
            console.error("[unity] 로드 실패", e);
          });
        };
        document.body.appendChild(script);
      }

      // SDK 모듈이 먼저 평가되도록 기다린다. CDN 이 막혀도 게임은 뜬다(3초 뒤 단독 부팅).
      if (window.__onestore) boot();
      else {
        var done = false;
        var go = function () { if (!done) { done = true; boot(); } };
        window.addEventListener("onestore-ready", go);
        setTimeout(go, 3000);
      }
    })();
  </script>
</body>
</html>
